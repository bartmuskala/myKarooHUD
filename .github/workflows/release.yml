name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle and Generate Manifest
        run: ./gradlew assembleRelease generateManifest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: app/manifest.json

      - name: Upload Icon artifact
        uses: actions/upload-artifact@v4
        with:
          name: icon
          path: ic_extension.png

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: .

      - name: Download Manifest
        uses: actions/download-artifact@v4
        with:
          name: manifest
          path: .

      - name: Download Icon
        uses: actions/download-artifact@v4
        with:
          name: icon
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-release.apk
            manifest.json
            ic_extension.png
